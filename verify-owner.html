<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>تحقق دخول المالك</title></head>
<body style="font-family:sans-serif;padding:24px;background:#000;color:#fff">
<h2>تحقق دخول المالك (معادل للتطبيق)</h2>
<input id="em" type="email" autocomplete="username" placeholder="البريد" style="width:340px;min-height:48px;display:block;margin:10px 0;font-size:18px">
<input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر" style="width:340px;min-height:48px;display:block;margin:10px 0;font-size:18px">
<button id="go" style="min-height:56px;padding:0 28px;font-size:18px">تحقق</button>
<pre id="out" style="margin-top:16px;font-size:18px;white-space:pre-wrap"></pre>
<script>
document.getElementById("go").onclick=async()=>{
  const out=document.getElementById("out"); out.textContent="جار التحقق...";
  try{
    const r=await fetch("https://www.googleapis.com/identitytoolkit/v3/relyingparty/verifyPassword?key=AIzaSyCWSN9MUrZp3XDVwMsL9dgKwKt7AGIhzq4",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("em").value,password:document.getElementById("pw").value,returnSecureToken:true})});
    const j=await r.json();
    if(!j.idToken){ out.textContent="FAIL-AUTH "+r.status+" "+(j.error&&j.error.message||""); return; }
    const B="https://blind-games-gate-default-rtdb.europe-west1.firebasedatabase.app";
    const d1=await fetch(B+"/devices.json?auth="+encodeURIComponent(j.idToken));
    const d2=await fetch(B+"/meta.json?auth="+encodeURIComponent(j.idToken));
    const m=d2.status===200?await d2.json():null;
    out.textContent="AUTH-OK uid="+j.localId+"\ndevices-list="+d1.status+"\nmeta-read="+d2.status+"\nmeta-owner="+(m&&m.owner);
  }catch(e){ out.textContent="FAIL-NET "+String(e).slice(0,120); }
};
</script></body></html>
